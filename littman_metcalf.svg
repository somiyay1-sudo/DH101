<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a" />
        </marker>
        <style>
            .label { font-family: "Times New Roman", serif; font-size: 18px; fill: #1a1a1a; }
            .title { font-family: "Times New Roman", serif; font-size: 22px; font-weight: 600; fill: #111; }
            .beam { stroke: #1a1a1a; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
            .cavity { stroke: #555; stroke-width: 1.8; fill: none; stroke-dasharray: 6 6; }
            .optic { stroke: #1a1a1a; stroke-width: 2; fill: #f6f2e9; }
            .mirror { stroke: #1a1a1a; stroke-width: 2; fill: #e9f1f6; }
            .grating { stroke: #1a1a1a; stroke-width: 2; fill: #f0f0f0; }
        </style>
    </defs>

    <rect x="20" y="20" width="960" height="560" fill="#fbfaf6" stroke="#e6e1d8" stroke-width="2" />

    <text x="40" y="60" class="title">Figuer : Littman–Metcalf configuration</text>

    <rect x="90" y="250" width="120" height="70" class="optic" />
    <text x="95" y="290" class="label">Diode Laser</text>

    <ellipse cx="260" cy="285" rx="28" ry="45" class="optic" />
    <text x="220" y="345" class="label">Collimating</text>
    <text x="232" y="365" class="label">Lens</text>

    <line x1="310" y1="230" x2="360" y2="340" class="grating" />
    <line x1="320" y1="240" x2="370" y2="350" class="grating" />
    <line x1="330" y1="250" x2="380" y2="360" class="grating" />
    <text x="300" y="215" class="label">Diffraction</text>
    <text x="330" y="235" class="label">Grating</text>

    <rect x="700" y="210" width="120" height="70" class="mirror" transform="rotate(-15 760 245)" />
    <text x="700" y="190" class="label">Tuning Mirror</text>

    <line x1="210" y1="285" x2="232" y2="285" class="beam" />
    <line x1="288" y1="285" x2="330" y2="285" class="beam" />
    <line x1="360" y1="285" x2="650" y2="285" class="beam" />
    <line x1="650" y1="285" x2="760" y2="245" class="beam" />

    <path d="M 760 245 L 650 285 L 360 360" class="cavity" />
    <path d="M 360 360 L 288 285" class="cavity" />

    <line x1="360" y1="285" x2="580" y2="180" class="beam" />
    <text x="520" y="160" class="label">Output</text>

    <rect x="360" y="260" width="10" height="50" class="grating" />
    <text x="380" y="320" class="label">0th Order</text>

    <circle cx="620" cy="150" r="4" fill="#1a1a1a" />
    <text x="635" y="155" class="label">1st Order</text>
</svg>
