### Concept E: Your Own Idea

#### Design Statement (300 words)

The core concept of this game revolves around "the ethics of using AI weaponry and the question of where responsibility lies." In recent years, AI-equipped weapons, known as Lethal Autonomous Weapons Systems (LAWS), have been under development. While these systems are capable of operating in hazardous environments, concerns have been raised regarding the implications of conducting combat operations based on AI decision-making alone. This game is designed to prompt players to contemplate the deployment of AI weaponry, the ethical judgments involved in its use, and the ultimate locus of responsibility. Within the game, players assume the role of a commander, faced with the choice of whether to deploy human combatants or utilize AI-driven weapons. However, should an AI system cause civilian casualties, who bears the responsibility? This game challenges players to confront the question of who is accountable for the actions of an AI, as well as the broader ethical dilemmas inherent in employing AI in combat. The notion of a non-human entity, an AI, making the decision to take a human life remains a subject of significant ethical debate. Furthermore, if an AI system does result in civilian casualties, players are given the choice: accept personal responsibility for the outcome, or shift that responsibility onto the AI itself. In the context of warfare, the use of AI signifies a departure from human limitations, a scenario in which a machine takes a human life. Players may, out of fear that the AI could go rogue, choose to forgo its use and instead send human soldiers into the fray. Yet, when those soldiers are subsequently wounded or killed in action, will the player continue to hesitate in deploying the AI? Or will they choose to overcome their ethical qualms, weighing the risks associated with AI, and deploy it to the front lines? This game captures that delicate balance between ethical considerations and the intense pressure of the battlefield.

"How I Use AI" Page (on your website)

What AI tools you used

In the creation of my "Makes," I utilize both ChatGPT and Perplexity. I use ChatGPT for brainstorming ideas, generating text, and structuring content, while I use Perplexity for research purposes?specifically for sourcing information and gathering news.

Specific prompts/tasks

The nature of AI tasks varies significantly depending on the specific project being undertaken. In particular, when creating images or GIFs, one relies heavily on the AI ??to handle a substantial portion of the work. Furthermore, since AI can generate code more quickly and accurately than humans?and because strict originality is often less critical in this context?AI assistance is frequently utilized for programming tasks.

In the creation of the game featured in this project, for instance, I generated the necessary code using prompts such as the following:
�EGenerate Twine code for a story about...

I also frequently use AI for research and gathering information. In this specific instance, I employed prompts such as these:
�EWhat are the ongoing debates regarding accountability and ethics surrounding LAWS?
�ETell me about real-world scenarios where AI is used in warfare.
�EHow does one go about coding in Twine?
�EHow do you create branching paths?
�EWrite a description that portrays a combat scene involving an AI drone with greater realism.

When using Perplexity, the output is accompanied by source citations; therefore, I make it a point to verify these sources. This practice is essential because AI models are prone to "hallucinating"?generating incorrect or fabricated responses?from time to time. However, searching with AI is more efficient than using Google, allowing one to reach relevant information sources more quickly. This would likely be particularly convenient for students?such as myself?for whom English is not a first language.

What you kept vs. changed
Regarding the utilization of AI, what you kept vs. changed, my strategy is to use AI to complement my areas of expertise, while conversely preserving my own core strengths as a source of originality. Since I am not particularly skilled at coding or drawing, I rely heavily on AI to handle tasks such as creating comics and managing the coding style for games. Therefore, regarding the formatting of images and code, I rarely make significant changes to the AI's output. However, the text output frequently undergoes substantial revision. I personally refine the AI's output in the areas of writing logical prose and organizing interesting ideas because I enjoy and excel at these tasks. In addition, since the AI's output often contains English that I do not fully understand, I rewrite it in a language that makes sense to me. Furthermore, as the text generated by the AI ??often does not align with my specific intentions, I treat its output merely as a source of ideas; the vast majority of the final text is constructed using my own original concepts.

Your policy on AI use

"AI is, first and foremost, a tool; it is humans who possess the capacity for true originality." This principle forms the very foundation of my AI policy. Fundamentally, I view AI as an assistive device, and I make it a rule to conceive the initial drafts and core concepts myself. I adhere to this approach because I frequently find AI-generated ideas unappealing, and?quite simply?I can formulate my own ideas much faster. Furthermore, the decision of how to utilize AI's output?or whether to use it at all?must ultimately rest with me. In other words, it is crucial that I retain the authority to make the "final judgment" regarding my work.

### Artist Statement (250 words)

Games allow for player agency, or the ability to make choices. Unlike an essay, which guides readers through a fixed argument, games require players to participate in the narrative through action. Players can determine how they engage with AI, including whether to rely on it. This format calls upon players to actively make judgments rather than passively absorb information. In this project, the ethical question is not merely presented as an abstract concept, but rather, it is experienced as a dilemma shaped by the player's decisions. By creating a simulated yet non-realistic space, games can place players in high-stakes situations that they would rarely encounter in real life. This game asks players to confront the possibility of entrusting AI with the decision to take a human life. This kind of tension, where choice, uncertainty, and responsibility unfold through interaction, is something that only the game form can produce.

I used AI to shape the combat descriptions in the game, aiming to create a stronger sense of realism. Without military experience, I felt limited in my ability to portray warfare convincingly. Even though it is generated by a system that has never experienced fear, pain, or moral responsibility, the language can sound immediate, convincing, and emotionally charged. This discrepancy became meaningful to me. In a game about lethal autonomous weapons, allowing AI to narrate scenes of combat creates an ethical parallel: Just as the player is asked whether to delegate life-or-death judgment to a machine, I, as the designer, was also confronted with how much expressive authority I was willing to delegate. At the same time, relying on AI raised an important question of authorship. If the game critiques the delegation of human judgment to AI, then using AI to narrate scenes of combat becomes part of that critique. Rather than seeing AI as a replacement for my voice, I treated it as a tool that generated possibilities that I then selected, revised, and framed. In that sense, the collaboration became part of the project's larger argument: even when AI contributes knowledge or language, responsibility for interpretation and presentation remains human.
