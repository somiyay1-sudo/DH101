      <textarea id="md-source" style="display:none"># How I Use AI

## What AI tools you used

In the creation of my "Makes," I use both ChatGPT and Perplexity. I use ChatGPT for brainstorming ideas, generating text, and structuring content, while I use Perplexity for research purposes, specifically for sourcing information and gathering news.

## Specific prompts/tasks

The nature of AI tasks varies depending on the project. When creating images or GIFs, I rely on AI to handle a substantial portion of the work. Since AI can generate code quickly and accurately, and strict originality is often less critical in this context, I also use AI assistance for programming tasks.

In the creation of the game featured in this project, for instance, I generated the necessary code using prompts such as:

- Generate Twine code for a story about...

I also frequently use AI for research and gathering information. In this specific instance, I employed prompts such as:

- What are the ongoing debates regarding accountability and ethics surrounding LAWS?
- Tell me about real-world scenarios where AI is used in warfare.
- How does one go about coding in Twine?
- How do you create branching paths?
- Write a description that portrays a combat scene involving an AI drone with greater realism.

When using Perplexity, the output is accompanied by source citations, so I verify these sources. This practice is essential because AI models can hallucinate, generating incorrect or fabricated responses. However, searching with AI is more efficient than using Google, allowing me to reach relevant information sources more quickly. This is particularly convenient for students like me for whom English is not a first language.

## What you kept vs. changed

Regarding AI use, my strategy is to use AI to complement my areas of weakness while preserving my own core strengths as a source of originality. Since I am not particularly skilled at coding or drawing, I rely heavily on AI to handle tasks such as creating comics and managing the coding style for games. As a result, I rarely make significant changes to the formatting of images and code. However, the text output often undergoes substantial revision.

I refine the AI output by rewriting logical prose and organizing ideas, because I enjoy and excel at these tasks. Since the AI output sometimes includes English that I do not fully understand, I rewrite it in language that makes sense to me. And because AI output often does not align with my intentions, I treat it as a source of ideas; most of the final text is constructed from my own original concepts.

Kept:

- Format of code
- Flow of the text
- Structure

Changed:

- Text (changed to easier language)
- Idea of AI

## Your policy on AI use

"AI is, first and foremost, a tool; it is humans who possess the capacity for true originality." This principle is the foundation of my AI policy. Fundamentally, I view AI as an assistive device, and I make it a rule to conceive the initial drafts and core concepts myself. I follow this approach because I often find AI generated ideas unappealing and I can formulate my own ideas much faster. Furthermore, the decision of how to use AI output, or whether to use it at all, must ultimately rest with me. In other words, it is crucial that I retain the authority to make the final judgment regarding my work.
