## Trapping Atomic Ions for Quantum Network
Ion trapping keeps charged particles isolated and stable so that quantum states can survive long enough to be controlled. With ions confined in an electromagnetic trap, lasers can manipulate them precisely and generate photons that carry quantum information between distant nodes.

## My Research: Photoionization of Lanthanum
Double-ionized lanthanum (La2+) is a promising qubit candidate because it can be laser-cooled and emits infrared photons compatible with optical fiber. A key step is creating and trapping ions. This project studies a two-photon photoionization sequence:

- A 706 nm laser excites the ground state to a metastable state.
- A 258 nm laser drives excitation to a higher 3G3 state, releasing a second electron.

## Why it matters
Trapped ions enable precise control for quantum networks and long-distance communication. Stable quantum memories and photonic links can improve both the speed and security of future information systems.
