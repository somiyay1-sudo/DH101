# Sustainability & Ethics

## 1. My Research

Data centers are indispensable infrastructure that supports cloud services and AI. However, they also constitute an industry that consumes vast quantities of water. A particularly critical issue is the cooling process required to dissipate the heat generated by servers. Many large-scale facilities use evaporative or water cooling systems, so it is not unusual for a single facility to use hundreds of thousands to millions of liters of water daily. In certain regions, this level of water usage places a significant strain on local resources. For example, the simultaneous expansion of data centers, construction of an Intel semiconductor plant, and growth of the population in the vicinity of New Albany has triggered a rapid surge in demand for limited water resources. Google's data center in the area, for example, consumes 3.6 million liters of water daily - an amount equivalent to a manufacturing plant's water usage. Furthermore, the issue extends beyond mere volume because water demand is heavily influenced by ambient temperature. Usage spikes sharply during the summer months, thereby straining peak water-supply capacity. However, we are often unable to verify detailed water usage figures due to confidentiality agreements between companies and government agencies. As this graph shows, data centers use more water than typical meat processing plants. While semiconductor factories and similar facilities utilize large quantities of water, they employ a substantial local workforce.

## 2. Data Sources

- Lei, Nuoa, et al. "The Water Use of Data Center Workloads: A Review and Assessment of Key Determinants." Resources, Conservation and Recycling, vol. 219, June 2025, p. 108310, https://doi.org/10.1016/j.resconrec.2025.108310.
- Lei, Nuoa, and Eric Masanet. "Climate- and Technology-Specific PUE and WUE Estimations for U.S. Data Centers Using a Hybrid Statistical and Thermodynamics-Based Approach." Resources, Conservation and Recycling, vol. 182, July 2022, p. 106323, https://doi.org/10.1016/j.resconrec.2022.106323.
- Mytton, David. "Data Centre Water Consumption." Npj Clean Water, vol. 4, no. 1, 15 Feb. 2021, https://www.nature.com/articles/s41545-021-00101-w, https://doi.org/10.1038/s41545-021-00101-w.

## 3. Personal Reflection

Lately, I have found myself turning to AI for answers more often than to Google Search. This is largely because, particularly when searching for academic papers or news articles, using AI allows me to pinpoint the specific sources I need more effectively. However, I have come to realize that using AI consumes nearly ten times as much electricity as a standard Google search; furthermore, it places a heavy strain on data centers and drives up water consumption. In short, by relying heavily on AI - even when it is not strictly necessary - we run the risk of wasting electricity and water. While it may require a bit more effort on my part, many of the tasks for which I currently use AI could just as easily be accomplished via Google Search. Going forward, I intend to continue using AI for specific purposes - such as the initial stages of research where I need to conduct a broad, high-level overview - but in situations where AI is not essential, I plan to refrain from using it and instead conduct my searches manually using Google. I believe that by adopting this approach, I can help reduce the environmental burden associated with electricity and water consumption.

## 4. Systemic vs. Individual

I believe the most essential element in addressing environmental issues is for individuals to understand the impact of their actions on the environment and seek accurate information. While restricting or banning the use of AI is unrealistic, if AI continues to degrade the environment, people will ultimately suffer the consequences. Before taking this course, I was unaware that AI consumes ten times as much electricity as a standard Google search and that data centers face significant water-related challenges. I had never imagined how my actions might affect the environment. For this reason, I believe the first step in addressing environmental issues is conveying the gravity of the problem to the public, particularly residents living in regions that host data centers. If people become aware of the environmental degradation occurring in their communities, they will likely change their consumption behaviors regarding AI. This requires not only individual behavioral shifts, but also systemic reform. Currently, local governments often enter into confidential agreements with corporations to attract data centers to their regions. These agreements make it difficult for the public to monitor factors such as water usage, raising serious transparency concerns. This system must be reformed to ensure greater transparency. Both the government and the corporations involved are responsible for this reform. However, shifting attitudes toward environmental issues is not solely the responsibility of corporations, but also of residents.
