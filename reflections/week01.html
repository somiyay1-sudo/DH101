## Reflect 1: What counts as "making" in the age of AI? What might be gained/lost when machines participate in making?

In the age of AI, "making" means connecting data and people. Relying on machines allows people to access large-scale data and digital archives. This exposure to new information and environments can stimulate creativity.

However, relying too much on AI could lead to a lack of human interaction, resulting in people only communicating with AI. This would likely result in a lack of human connection. We may no longer be able to define something as "made by humans." If people stop communicating with each other and entrust everything to AI, the distinction between "human-made" and "AI-made" will become blurred, and the concept of "making" will belong to AI.
