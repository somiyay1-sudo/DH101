## Reflect 4: Is AI a collaborator, tool, or plagiarist in storytelling?

In storytelling, AI is a plagiarist, not a collaborator. We have traditionally used various tools in storytelling, but they have never made judgments or altered our ideas without permission. Generative AI "interprets" our ideas and produces appropriate expressions in its own way. However, these are "altered" stories that do not help express the author's original idea. In other words, AI steals our ideas and often edits them in ways the original author did not intend or simplifies and generalizes them beyond what the author wanted. When we asked AI to draw a comic, the results were mundane drawings that failed to express human and cat emotions adequately. Changing the prompts did not improve the outputs. This makes it seem like AI is not a collaborator in storytelling but rather a plagiarist.
