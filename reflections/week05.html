## Reflect 5: How does AI alter authorship and remix culture? Who owns AI-made art?

AI can negate the concepts of authorship and originality. If AI came up with an "original" idea and used AI to complete the entire GIF creation process, there would be no author, meaning the AI would have authorship of the work. However, as long as AI is used as a human tool and not the other way around, authorship and originality can be maintained. Nevertheless, AI poses a significant threat to remix culture because it can remix much faster than humans can, which increases the likelihood of copyright infringement on a much larger scale. If AI were to create a large number of low-quality remixes, it would not only lead to the collapse of the concept of authorship but also cause remix culture to lose interest.
