## Reflect 7: How does AI reshape global geographies of power, labor, and environment?

The emergence of AI will likely accelerate the shift of power from governments to tech companies in global geographies. Until now, government agencies and the media have held most of the power, but as private companies develop AI, they will own the digital infrastructure rather than governments. This change directly reshapes global geographies of power, weakening the concept of government sovereignty and giving power to tech companies. However, I do not believe that advances in AI will significantly alter the global geographies, such as the distinction between developed and developing countries, in areas such as labor and the environment. In fact, it will likely reinforce existing disparities. This is because large tech companies are currently based in developed countries, and many of the mineral resources extracted in developing countries are used by developed countries.
