## Reflect 8: Who is visible/invisible in AI networks? How does visualization reveal or obscure power?

In AI networks, major tech companies (e.g., Google and Amazon) and flagship models (e.g., Gemini and ChatGPT) are highly visible actors. Their contributions are well-documented and widely cited, creating the impression that innovation is concentrated and centralized. In contrast, many crucial contributors remain invisible. For instance, cases of children being trafficked into working in mines and laborers being forced to work in terrible conditions are often concealed. These hidden contributions include data labelers, low-paid contractors, and communities whose data is extracted to train models without recognition or consent. Visualization plays a powerful role in shaping these dynamics. Network diagrams, dashboards, and model visualizations can make complex systems legible by mapping the flow of data, influence, and decision-making processes. When used critically, these visualizations reveal hidden dependencies, such as reliance on global labor markets or specific data sources, and expose asymmetries in control and benefit. However, visualization can also obscure power. The search engines Google and Safari are operated by tech companies that can hide information that is inconvenient for them. In other words, accurate analysis may be difficult as long as tech companies control the sources, even if we try to visualize power through data visualization.
