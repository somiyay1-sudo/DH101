## Reflect 10: How does AI change our relationship to play, rules, and narrative?

The advent of AI compels us to demand greater responsibility and ethical awareness in our relationships with play, rules, and narrative. Until now, humans were the sole agents of judgment in all human activities. However, with the rise of AI, the capacity to make judgments has expanded to include AI systems. Yet, under current circumstances, it remains unclear whether AI itself bears responsibility for the judgments it renders. In fact, should an error occur, the burden of responsibility likely falls on the human user who utilized the AI. Furthermore, "codes of ethics" have been established to govern the use of AI. AI appears to call for a broader scope of responsibility, along with a heightened ethical consciousness on the part of the user, in relation to our engagement with play, rules, and narrative.
