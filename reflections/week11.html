## Reflect 11: Who does the invisible work of AI, and who profits from it?

The invisible work behind AI is carried out by miners, especially in the Democratic Republic of the Congo, where cobalt is extracted under dangerous and exploitative conditions. Many of these miners are adults trying to support families, but children also comprise this workforce, demonstrating the profound impact of poverty and inequality on the supply chain. These miners work long hours for very low wages to supply the minerals needed for batteries and digital technologies. While major tech companies, battery manufacturers, mineral traders, and other corporations at the top of the supply chain reap the greatest financial rewards, the miners who endure the harshest conditions receive only a tiny fraction of the value they create. This creates a sharp imbalance between risk and reward. Those who face the greatest physical danger, insecurity, and environmental harm are typically the least able to influence prices, labor standards, or contracts. Many tech companies fail to return their profits to those responsible for mineral extraction, treating them as if they were a colony.
