## Reflect 12: AI & Ecology, Is AI sustainable? What ecological trade-offs are we willing to accept?

I think AI is not sustainable if it developed rapoidly. Water scarcity caused by data centers is one critical enviromental issues on AI. Despite contributing little to local economies, data centers consume enormous quantities of water. The proliferation of data centers implies a corresponding reduction in the amount of water available for our use. In this respect, AI is not sustainable. Furthermore, it is widely predicted that as AI advances, human employment opportunities will diminish. If AI simultaneously consumes vast amounts of water and displaces our jobs, humanity will face a "one-two punch" -- suffering from both joblessness and water shortages. If AI is allowed to develop haphazardly -- leading to an excessive proliferation of data centers -- it could degrade the environment; far from enriching human lives, it risks making them worse.
